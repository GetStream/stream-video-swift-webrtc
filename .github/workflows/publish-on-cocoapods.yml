name: "Publish on Cocoapods"

# Promotes an existing stream-video-swift-webrtc GitHub release to CocoaPods.
# The upstream WebRTC trigger does not run this workflow.
# CocoaPods has no prerelease flag. A GitHub pre-release is published only when its
# version is already a CocoaPods pre-release (letter or hyphen, for example 1.2.3-beta.1).
# A stable version marked pre-release on GitHub is skipped, because Trunk would ship it as final.
# No xcframework build, signing, GitHub release creation, or Package.swift update happens here.

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: "Existing stream-video-swift-webrtc release URL to publish to CocoaPods"
        required: true
      use_dispatch_branch:
        description: "Run from the selected workflow branch and restore only the release tag podspec"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Publish Pods Version
    runs-on: macos-26
    steps:
      - name: Resolve release version
        id: resolve_release
        env:
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          ruby <<'RUBY'
          require 'uri'

          uri = URI.parse(ENV.fetch('RELEASE_URL'))
          release_path = '/GetStream/stream-video-swift-webrtc/releases/tag/'
          unless uri.scheme == 'https' && uri.host == 'github.com' && uri.path.start_with?(release_path)
            abort('Release URL must be under https://github.com/GetStream/stream-video-swift-webrtc/releases/tag/')
          end

          version = uri.path.delete_prefix(release_path).chomp('/')
          abort('Release URL must include a version tag') if version.empty? || version.include?('/')

          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |file|
            file.puts("version=#{version}")
          end
          RUBY

      - name: Read GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve_release.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$VERSION" \
            --repo GetStream/stream-video-swift-webrtc \
            --json isDraft,isPrerelease \
            --jq '"draft=\(.isDraft)\nprerelease=\(.isPrerelease)"' \
            >> "$GITHUB_OUTPUT"

      - name: Decide whether CocoaPods can publish this release
        id: pods
        env:
          VERSION: ${{ steps.resolve_release.outputs.version }}
          DRAFT: ${{ steps.github_release.outputs.draft }}
          PRERELEASE: ${{ steps.github_release.outputs.prerelease }}
        run: |
          ruby <<'RUBY'
          abort('GitHub release is still a draft') if ENV.fetch('DRAFT') == 'true'

          version = ENV.fetch('VERSION').sub(/\+[0-9A-Za-z.\-]+\z/, '')
          prerelease = ENV.fetch('PRERELEASE') == 'true'
          # Same rule as CocoaPods Version#prerelease?: a letter or hyphen, after build metadata.
          pods_prerelease = version.match?(/[A-Za-z\-]/)
          publish = !prerelease || pods_prerelease
          reason = if publish
                     prerelease ? 'GitHub pre-release uses a CocoaPods pre-release version' : 'GitHub release is final'
                   else
                     'GitHub release is a pre-release and CocoaPods would publish this stable version as final'
                   end

          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |file|
            file.puts("publish=#{publish}")
            file.puts("reason=#{reason}")
          end
          RUBY

      - name: Connect Bot
        if: ${{ steps.pods.outputs.publish == 'true' }}
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

      - uses: actions/checkout@v4.1.1
        if: ${{ steps.pods.outputs.publish == 'true' }}
        with:
          fetch-depth: 0
          # By default, publish from the exact release tag. For release recovery, use the
          # selected dispatch branch so workflow/Fastfile fixes can run against an existing tag.
          ref: ${{ inputs.use_dispatch_branch && github.ref || steps.resolve_release.outputs.version }}

      - name: Restore release podspec
        if: ${{ steps.pods.outputs.publish == 'true' && inputs.use_dispatch_branch }}
        env:
          VERSION: ${{ steps.resolve_release.outputs.version }}
        run: |
          # Keep the workflow and Fastfile from the selected dispatch branch, but publish the
          # podspec that belongs to the immutable release tag.
          git fetch --force --depth=1 origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          git show "${VERSION}:StreamWebRTC.podspec" > StreamWebRTC.podspec

      - name: Set up Ruby
        if: ${{ steps.pods.outputs.publish == 'true' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: "Fastlane - Publish Pods"
        if: ${{ steps.pods.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.CI_BOT_GITHUB_TOKEN }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: bundle exec fastlane release_cocoapods version:"${{ steps.resolve_release.outputs.version }}" pre_release:${{ steps.github_release.outputs.prerelease }} --verbose
        timeout-minutes: 20

      - uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: ${{ job.status }}
          text: |
            ❌ StreamVideoWebRTC CocoaPods release failed! 🚢

            Flow: Publish on Cocoapods
            Version: ${{ steps.resolve_release.outputs.version }}
            Release URL: ${{ inputs.release_url }}
            Pre-release: ${{ steps.github_release.outputs.prerelease }}

            cc: <!subteam^S05RBQ69U1H>
          fields: repo
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - uses: 8398a7/action-slack@v3
        if: ${{ success() && steps.pods.outputs.publish == 'false' }}
        with:
          status: ${{ job.status }}
          text: |
            CocoaPods publish skipped.

            Flow: Publish on Cocoapods
            Version: ${{ steps.resolve_release.outputs.version }}
            Release URL: ${{ inputs.release_url }}
            Reason: ${{ steps.pods.outputs.reason }}

            cc: <!subteam^S05RBQ69U1H>
          fields: repo
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - uses: 8398a7/action-slack@v3
        if: ${{ success() && steps.pods.outputs.publish == 'true' }}
        with:
          status: ${{ job.status }}
          text: |
            🎉 StreamVideoWebRTC CocoaPods release has been shipped! 🚢

            Flow: Publish on Cocoapods
            Version: ${{ steps.resolve_release.outputs.version }}
            Release URL: ${{ inputs.release_url }}
            Pre-release: ${{ steps.github_release.outputs.prerelease }}

            cc: <!subteam^S05RBQ69U1H>
          fields: repo
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
