name: "Build"

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: "The branch of WebRTC to build from"
        required: true
        default: "main"

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: { group: scaleway-macos }
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ios-certificates

      - name: Connect Bot
        # Send SSH git URLs (match, WebRTC source) over HTTPS with the token.
        run: >-
          git config --global
          url."https://x-access-token:${TOKEN}@github.com/GetStream/".insteadOf
          "git@github.com:GetStream/"
        env:
          TOKEN: ${{ steps.bot-token.outputs.token }}

      - uses: actions/checkout@v4.1.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Git authentication
        run: |
          echo "This step is required to bypass `git credential-luci login`"
          git config --global credential.helper store
          echo "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials

      - name: "Build"
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: bundle exec fastlane build webrtc_branch:${{ inputs.webrtc_branch }} --verbose
        timeout-minutes: 120

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StreamWebRTC.xcframework.zip
          path: fastlane/StreamWebRTC.xcframework.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WebRTC.xcframework.zip
          path: fastlane/WebRTC.xcframework.zip
          retention-days: 7
